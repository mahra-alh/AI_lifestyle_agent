# Docker Compose configuration for local development

services:
  api:

    # Build the image from the Dockerfile in the project root
    build:
      context: .
      dockerfile: Dockerfile

    # Name assigned to the resulting image
    image: ai_docker_deploy

    # Port mapping:
    # localhost:9000 -> container:8000
    ports:
      - "9000:8000"

    # Environment variables available inside the container
    environment:
      GCP_PROJECT_ID: ai-lifestyle-agent-7e96c
      GOOGLE_CLOUD_PROJECT: ai-lifestyle-agent-7e96c
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud/application_default_credentials.json

    # Mount Google Application Default Credentials from the host
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcloud/application_default_credentials.json:ro

      # Google Calendar OAuth files — mounted at runtime, never baked into
      # the image (.dockerignore excludes them). credentials.json is
      # read-only; token.json stays writable so token refresh can update it.
      - ./ai_agent/tools/calendar/credentials.json:/app/ai_agent/tools/calendar/credentials.json:ro
      - ./ai_agent/tools/calendar/token.json:/app/ai_agent/tools/calendar/token.json

    # Start FastAPI
    command: >
      uvicorn ai_agent.server:app
      --host 0.0.0.0
      --port 8000