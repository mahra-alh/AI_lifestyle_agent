services:
  python-agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHON_AGENT_URL: http://python-agent:8000
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - python-agent
    restart: unless-stopped
